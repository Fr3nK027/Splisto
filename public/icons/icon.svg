<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Splisto: cartellino d'ottone su velluto verde bottiglia (sorgente delle PNG in public/icons) -->
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3328"/>
      <stop offset="1" stop-color="#0a1612"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d596"/>
      <stop offset="0.45" stop-color="#c8a35a"/>
      <stop offset="0.55" stop-color="#b08b44"/>
      <stop offset="1" stop-color="#7d5f28"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#velvet)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#c8a35a" stroke-opacity="0.35" stroke-width="2"/>
  <!-- cartellino inclinato, foro con anello -->
  <g transform="rotate(-38 64 64) translate(64 64) scale(1.32) translate(-61 -64)" filter="url(#drop)">
    <path d="M30 46 L62 46 L98 64 L62 82 L30 82 Q24 82 24 76 L24 52 Q24 46 30 46 Z" fill="url(#brass)"/>
    <path d="M30 46 L62 46 L98 64" fill="none" stroke="#fff3cf" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="70" cy="64" r="6.5" fill="#0c1a14"/>
    <circle cx="70" cy="64" r="6.5" fill="none" stroke="#7d5f28" stroke-width="1.5"/>
    <rect x="34" y="58" width="22" height="3" rx="1.5" fill="#1b1407" fill-opacity="0.55"/>
    <rect x="34" y="66" width="14" height="3" rx="1.5" fill="#1b1407" fill-opacity="0.55"/>
  </g>
</svg>
