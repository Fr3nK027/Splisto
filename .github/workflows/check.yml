name: check
on: [push, pull_request]
permissions:
  contents: write # per creare la release
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # i test girano direttamente sui file .ts (node --test)
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # versione nuova nel manifest: release con lo zip (installazione a mano) e splisto.json (aggiornamento dalla dashboard)
      - name: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./dist/manifest.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v esiste già"; exit 0; fi
          node scripts/bundle.mjs dist splisto.json
          (cd dist && zip -qr ../splisto.zip .)
          gh release create "v$v" splisto.zip splisto.json --target "$GITHUB_SHA" --title "Splisto $v" --generate-notes
